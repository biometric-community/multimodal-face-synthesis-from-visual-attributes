paper:
  slug: multimodal-face-synthesis-from-visual-attributes
  title: "Multimodal Face Synthesis from Visual Attributes"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  max_train: 256
  max_val: 64
  max_test: 64
model:
  image_size: 64
  z_dim: 128
  base_ch: 256
  d_base_ch: 64
  modalities: [visible, sketch]
train:
  protocol: smoke
  epochs: 1
  batch_size: 16
  lr: 0.001
  lambda_rec: 10.0
  lambda_cls: 1.0
  seed: 42
  num_workers: 2
  log_every: 5
  max_steps: 40
eval:
  batch_size: 16
  max_images: 64
paths:
  checkpoint_dir: outputs/checkpoints/smoke
  log_dir: outputs/logs
  pred_dir: outputs/predictions/smoke
  figure_dir: outputs/figures
device: cuda
